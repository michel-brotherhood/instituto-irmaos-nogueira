# Proxy reverso no NGINX DO SERVIDOR (fora do Docker) → container em 127.0.0.1:8080
# Copiar para /etc/nginx/sites-available/institutoirmaosnogueira.conf, criar o link em sites-enabled,
# depois:  sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d institutoirmaosnogueira.com.br -d www.institutoirmaosnogueira.com.br
# (o certbot acrescenta o bloco 443 e a renovação automática)

# Domínio sem www → www (o site usa www como canônico)
server {
  listen 80;
  listen [::]:80;
  server_name institutoirmaosnogueira.com.br;
  return 301 https://www.institutoirmaosnogueira.com.br$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  server_name www.institutoirmaosnogueira.com.br;

  client_max_body_size 1m;   # site estático: não recebe uploads

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
