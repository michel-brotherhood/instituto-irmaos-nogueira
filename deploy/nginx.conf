server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;   # atrás do proxy reverso da VPS: redireciona sem porta/host interno
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  # Segurança
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; connect-src 'self' https:; img-src 'self' data: https:; media-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'self'; form-action 'self' https: mailto:; base-uri 'self'" always;

  # Redirecionamentos do site antigo (WordPress) — 301 preserva SEO
  location = /venha-fazer-parte  { return 301 /doar/; }
  location = /venha-fazer-parte/ { return 301 /doar/; }
  location ~ ^/(feed|comments/feed|wp-login\.php|xmlrpc\.php)/?$ { return 301 /; }

  # Cache longo para assets versionados
  location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location /media/  { add_header Cache-Control "public, max-age=2592000"; try_files $uri =404; }
  location /wp-content/uploads/ { add_header Cache-Control "public, max-age=2592000"; try_files $uri =404; }

  location / {
    add_header Cache-Control "public, max-age=600";
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
}
