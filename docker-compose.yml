# Instituto Irmãos Nogueira — site estático (Astro → HTML) servido por nginx.
# Sem banco de dados, sem uploads, sem estado: o container pode ser recriado a qualquer momento.
#
# Uso na VPS:  cp .env.example .env  →  editar  →  ./scripts/deploy.sh
#
# O container escuta SÓ em 127.0.0.1:${HOST_PORT} (padrão 8080). Quem expõe 80/443 com HTTPS é o
# proxy reverso do servidor (nginx/Caddy/Traefik). Não há nada exposto direto para a internet.
name: iin-site

services:
  web:
    build:
      context: .
      # Variáveis PUBLIC_* são públicas (vão para o HTML) e entram no BUILD — não são segredos.
      args:
        PUBLIC_CONTACT_EMAIL: ${PUBLIC_CONTACT_EMAIL:-}
        PUBLIC_WHATSAPP: ${PUBLIC_WHATSAPP:-}
        PUBLIC_INSTAGRAM_URL: ${PUBLIC_INSTAGRAM_URL:-}
        PUBLIC_YOUTUBE_URL: ${PUBLIC_YOUTUBE_URL:-}
        PUBLIC_FACEBOOK_URL: ${PUBLIC_FACEBOOK_URL:-}
        PUBLIC_SIGNUP_FORM_URL: ${PUBLIC_SIGNUP_FORM_URL:-}
        PUBLIC_DONATION_CHECKOUT_URL: ${PUBLIC_DONATION_CHECKOUT_URL:-}
        PUBLIC_SPONSOR_FORM_ENDPOINT: ${PUBLIC_SPONSOR_FORM_ENDPOINT:-}
        PUBLIC_DPO_EMAIL: ${PUBLIC_DPO_EMAIL:-}
        PUBLIC_GA_ID: ${PUBLIC_GA_ID:-}
        PUBLIC_MAP_TILE_KEY: ${PUBLIC_MAP_TILE_KEY:-}
    image: iin-site:latest
    container_name: iin-site
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:80"
    security_opt:
      - no-new-privileges:true
    # nginx servindo arquivo estático usa ~10 MB; o limite só protege o resto da VPS.
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
